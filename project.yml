name: ghast
options:
  bundleIdPrefix: com.ghast
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_OBJC_BRIDGING_HEADER: ghast-Bridging-Header.h
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_ENTITLEMENTS: ghast.entitlements
    INFOPLIST_FILE: Resources/Info.plist

targets:
  ghast:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
    resources:
      - path: Resources
        type: group
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghast.app
        PRODUCT_NAME: ghast
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/ghostty/macos"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        OTHER_LDFLAGS:
          - "-lc++"
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
          - "-framework"
          - IOSurface
          - "-framework"
          - UniformTypeIdentifiers
          - "-framework"
          - Carbon
    dependencies:
      - framework: ghostty/macos/GhosttyKit.xcframework
        embed: false

    # ponytail: copy ghostty's terminfo + shell-integration into the app bundle so
    # libghostty finds them at runtime. zig-out/share is the canonical layout.
    preBuildScripts:
      - script: |
          set -euo pipefail
          SHARE="$PROJECT_DIR/ghostty/zig-out/share"
          DEST="$PROJECT_DIR/Resources/ghostty"
          if [ ! -d "$SHARE/terminfo" ] || [ ! -d "$SHARE/ghostty/shell-integration" ]; then
            echo "warning: ghostty resources not found in zig-out/share; terminfo/shell-integration will be missing"
            exit 0
          fi
          mkdir -p "$DEST"
          rm -rf "$DEST/terminfo" "$DEST/shell-integration"
          cp -R "$SHARE/terminfo" "$DEST/terminfo"
          cp -R "$SHARE/ghostty/shell-integration" "$DEST/shell-integration"
        name: Copy Ghostty Resources

    # Copy the prepared Resources/ghostty tree into the bundle so libghostty
    # finds terminfo + shell-integration at runtime (GHOSTTY_RESOURCES_DIR).
    postBuildScripts:
      - script: |
          set -euo pipefail
          SRC="$PROJECT_DIR/Resources/ghostty"
          BUNDLE_RES="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources"
          if [ ! -d "$SRC/terminfo" ] || [ ! -d "$SRC/shell-integration" ]; then
            echo "warning: ghostty resources missing; skipping bundle copy"
            exit 0
          fi
          mkdir -p "$BUNDLE_RES/ghostty"
          rm -rf "$BUNDLE_RES/ghostty/terminfo" "$BUNDLE_RES/ghostty/shell-integration"
          cp -R "$SRC/terminfo" "$BUNDLE_RES/ghostty/terminfo"
          cp -R "$SRC/shell-integration" "$BUNDLE_RES/ghostty/shell-integration"
        name: Copy Ghostty Resources to Bundle

schemes:
  ghast:
    build:
      targets:
        ghast: all
    run:
      config: Debug
      environmentVariables:
        # ponytail: silences macOS system-framework XPC spam (com.apple.linkd.autoShortcut,
        # task port right errors) that fires before app code runs in unsigned dev builds.
        - variable: OS_ACTIVITY_MODE
          value: disable
          isEnabled: true
